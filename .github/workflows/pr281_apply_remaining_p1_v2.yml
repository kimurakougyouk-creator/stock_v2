name: PR281 apply remaining P1 fixes v2

on:
  push:
    branches:
      - fix/codex-p1-live-pilot-safety-20260908

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 4

      - name: Verify safety-critical files still equal reviewed exact head
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5ed1c8704bce8ed0e3821f55d5a83cd068d161f4 HEAD
          git diff --quiet 5ed1c8704bce8ed0e3821f55d5a83cd068d161f4 HEAD -- \
            src/ai_asset_platform/execution/live_pilot_completion.py \
            src/ai_asset_platform/execution/live_pilot_send_journal.py \
            tests/test_live_pilot_completion.py \
            tests/test_live_pilot_completion_pending_alert.py \
            tests/test_live_pilot_send_journal.py

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ibapi==9.81.1.post1

      - name: Reuse exact guarded patch program from first attempt
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /^          python - <<'"'"'PY'"'"'$/ {capture=1; next}
            /^          PY$/ {capture=0; exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/pr281_apply_remaining_p1.yml > /tmp/pr281_apply.py
          test -s /tmp/pr281_apply.py
          python /tmp/pr281_apply.py
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/test_live_pilot_completion_pending_alert.py")
          p.write_text(p.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY

      - name: Static checks
        run: |
          git diff --check
          python -m py_compile \
            src/ai_asset_platform/execution/live_pilot_completion.py \
            src/ai_asset_platform/execution/live_pilot_send_journal.py \
            tests/test_live_pilot_completion.py \
            tests/test_live_pilot_completion_pending_alert.py \
            tests/test_live_pilot_send_journal.py
          python scripts/check_secrets.py

      - name: Run targeted regression tests
        run: |
          pytest -q \
            tests/test_live_pilot_completion.py \
            tests/test_live_pilot_completion_pending_alert.py \
            tests/test_live_pilot_send_journal.py

      - name: Run full pytest
        run: pytest -q

      - name: Commit tested corrections to same PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-codex-connector"
          git config user.email "14957082+chatgpt-codex-connector@users.noreply.github.com"
          git add \
            src/ai_asset_platform/execution/live_pilot_completion.py \
            src/ai_asset_platform/execution/live_pilot_send_journal.py \
            tests/test_live_pilot_completion.py \
            tests/test_live_pilot_completion_pending_alert.py \
            tests/test_live_pilot_send_journal.py
          git diff --cached --check
          git commit -m "Close remaining exact-head Live pilot P1 findings"
          git push origin HEAD:fix/codex-p1-live-pilot-safety-20260908
