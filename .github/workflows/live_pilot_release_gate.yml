name: live_pilot_release_gate

# Read-only, advisory release-integrity check for PRs into main. It never
# gates Live execution, never comments on the PR, never re-runs pytest (that
# is protect-main's required "pytest" check), and never opens a broker
# connection. See scripts/live_pilot_release_gate.py for the actual checks.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  release-integrity-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact PR head commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run release-integrity gate (read-only, advisory)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/live_pilot_release_gate.py
