name: pytest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # 実IBKR接続やPaper/Live注文送信は行わない。
    # このジョブは静的な秘密情報スキャンとpytestのみを実行する。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Scan tracked files for committed secrets
        run: python scripts/check_secrets.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # ibapi is installed only so tests importing the IBKR API can be collected.
          # CI does not connect to TWS/Gateway or transmit Paper/Live orders.
          pip install ibapi==9.81.1.post1
          pip install -e .

      - name: Verify plain-python runtime import (not just pytest's pythonpath=src)
        run: |
          python -c "
          import os
          import ai_asset_platform
          resolved = os.path.realpath(ai_asset_platform.__file__)
          expected = os.path.realpath(os.path.join(os.getcwd(), 'src', 'ai_asset_platform', '__init__.py'))
          assert resolved == expected, f'ai_asset_platform resolved to {resolved}, expected {expected}'
          print('OK:', resolved)
          "

      - name: Run pytest
        run: pytest -q
